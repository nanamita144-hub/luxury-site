<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 330" role="img" aria-label="Hermès Paris">
  <title>Hermès Paris</title>

  <!-- ── Horse (facing left, body centred ~170,138) ── -->
  <!-- Body -->
  <ellipse cx="174" cy="138" rx="82" ry="46" fill="#111"/>
  <!-- Neck -->
  <rect x="98" y="82" width="58" height="50" rx="10" fill="#111" transform="rotate(-22 127 107)"/>
  <!-- Head -->
  <ellipse cx="68" cy="72" rx="34" ry="18" fill="#111" transform="rotate(-15 68 72)"/>
  <!-- Ear -->
  <polygon points="76,54 84,39 92,55" fill="#111"/>
  <!-- Eye highlight -->
  <circle cx="56" cy="66" r="3.5" fill="white"/>
  <!-- Mane -->
  <path d="M 102,90 C 110,76 116,63 121,56" fill="none" stroke="#111" stroke-width="8" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M 254,118 Q 292,92 286,144 Q 282,166 268,156" fill="none" stroke="#111" stroke-width="11" stroke-linecap="round"/>

  <!-- Front legs -->
  <rect x="118" y="178" width="13" height="54" rx="3" fill="#111" transform="rotate(-6 118 178)"/>
  <rect x="138" y="178" width="13" height="54" rx="3" fill="#111" transform="rotate(5 138 178)"/>
  <!-- Rear legs -->
  <rect x="210" y="178" width="13" height="54" rx="3" fill="#111" transform="rotate(-8 210 178)"/>
  <rect x="230" y="178" width="13" height="54" rx="3" fill="#111" transform="rotate(6 230 178)"/>

  <!-- Harness pole from horse to carriage -->
  <line x1="258" y1="152" x2="98" y2="102" stroke="#111" stroke-width="5"/>

  <!-- ── Carriage ── -->
  <!-- Body -->
  <rect x="298" y="100" width="88" height="72" rx="5" fill="#111"/>
  <!-- Roof -->
  <rect x="310" y="86" width="68" height="18" rx="4" fill="#111"/>

  <!-- Large rear wheel -->
  <circle cx="310" cy="193" r="40" fill="none" stroke="#111" stroke-width="7"/>
  <circle cx="310" cy="193" r="6" fill="#111"/>
  <line x1="310" y1="153" x2="310" y2="233" stroke="#111" stroke-width="3.5"/>
  <line x1="270" y1="193" x2="350" y2="193" stroke="#111" stroke-width="3.5"/>
  <line x1="282" y1="165" x2="338" y2="221" stroke="#111" stroke-width="3.5"/>
  <line x1="338" y1="165" x2="282" y2="221" stroke="#111" stroke-width="3.5"/>

  <!-- Small front wheel -->
  <circle cx="390" cy="200" r="26" fill="none" stroke="#111" stroke-width="6"/>
  <circle cx="390" cy="200" r="5" fill="#111"/>
  <line x1="390" y1="174" x2="390" y2="226" stroke="#111" stroke-width="3"/>
  <line x1="364" y1="200" x2="416" y2="200" stroke="#111" stroke-width="3"/>
  <line x1="371" y1="181" x2="409" y2="219" stroke="#111" stroke-width="3"/>
  <line x1="409" y1="181" x2="371" y2="219" stroke="#111" stroke-width="3"/>

  <!-- ── Groom ── -->
  <rect x="437" y="128" width="22" height="44" rx="3" fill="#111"/>
  <circle cx="448" cy="118" r="12" fill="#111"/>
  <!-- Top hat -->
  <rect x="439" y="98" width="18" height="23" rx="2" fill="#111"/>
  <rect x="433" y="119" width="30" height="4" fill="#111"/>
  <!-- Legs -->
  <rect x="439" y="172" width="9" height="36" fill="#111"/>
  <rect x="450" y="172" width="9" height="36" fill="#111"/>
  <!-- Arm forward -->
  <line x1="437" y1="142" x2="414" y2="156" stroke="#111" stroke-width="7" stroke-linecap="round"/>

  <!-- Ground lines -->
  <line x1="28" y1="238" x2="474" y2="238" stroke="#111" stroke-width="3"/>
  <line x1="28" y1="244" x2="474" y2="244" stroke="#111" stroke-width="1.5"/>

  <!-- HERMÈS text -->
  <text x="250" y="287"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="50"
        font-weight="700"
        letter-spacing="5"
        fill="#111">HERMÈS</text>

  <!-- PARIS text -->
  <text x="250" y="320"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="22"
        font-weight="400"
        letter-spacing="16"
        fill="#111">PARIS</text>
</svg>
