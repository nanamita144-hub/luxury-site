  <text x="96" y="228"
        text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="10.5"
        font-weight="700"
        letter-spacing="4"
        fill="#111">LOUIS VUITTON</text>
</svg>
