<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 248" role="img" aria-label="Louis Vuitton">
  <title>Louis Vuitton</title>

  <!-- V shape drawn first (behind L) using evenodd for the inner notch -->
  <path fill-rule="evenodd"
        d="M 30,12 L 178,12 L 108,200 Z
           M 65,12 L 148,12 L 108,172 Z"
