  <text x="145" y="88"
        text-anchor="middle"
        font-family="Impact, 'Arial Black', 'Arial Narrow', sans-serif"
        font-size="72"
        fill="#1a1a1a"
        letter-spacing="1">Kiton</text>
</svg>
