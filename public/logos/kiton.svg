<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 105" role="img" aria-label="Kiton">
  <title>Kiton</title>

  <!-- Red dot above the i  (Impact font, size 72, centered x=145)
       K≈46px, then i starts at ~191 from left edge; text left-edge ≈ 145−88=57
